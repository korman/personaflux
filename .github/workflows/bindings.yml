name: bindings

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p personaflux-ffi --release
      - run: nm -D target/release/libpersonaflux.so | grep -E ' pf_(api_version|simulation_create|simulation_destroy|simulation_submit_direct_witness)$'

  c-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: clang --version
      - run: clang -std=c11 -Wall -Wextra -Werror -I crates/personaflux-ffi/include -c crates/personaflux-ffi/tests/header_smoke.c -o /tmp/personaflux-header-smoke.o

  csharp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: cargo build -p personaflux-ffi
      - run: dotnet build bindings/csharp/PersonaFlux.csproj
      - shell: pwsh
        run: |
          $env:PERSONAFLUX_NATIVE_PATH = "$env:GITHUB_WORKSPACE\target\debug\personaflux.dll"
          dotnet run --project bindings/csharp/tests/PersonaFlux.IntegrationTests.csproj --no-build

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: cargo build -p personaflux-ffi --release
      - run: swift test -Xlinker -L"$GITHUB_WORKSPACE/target/release" -Xlinker -lpersonaflux
      - run: bash bindings/swift/scripts/build_xcframework.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - run: cargo install cargo-ndk --locked
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - run: bash bindings/kotlin/scripts/build_android.sh
